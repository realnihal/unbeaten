name = "unbeaten-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "unbeaten"
# Replace with the id printed by `npx wrangler d1 create unbeaten` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://realnihal.github.io,http://localhost:5173"
# Set a real salt in production with: npx wrangler secret put IP_SALT
